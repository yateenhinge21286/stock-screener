name: Daily Technical Stock Screener

on:
  schedule:
    # 8:05 AM IST is 2:35 AM UTC (starts 25 minutes before 8:30 AM to account for scan run time)
    - cron: '35 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Screener Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/cli_run.js
